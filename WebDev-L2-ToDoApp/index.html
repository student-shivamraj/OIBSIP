<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To-Do Web App</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="wrap">
  <h1>My To-Do List</h1>

  <div class="composer">
    <input type="text" id="taskInput" placeholder="Add a new task..." />
    <button id="addBtn">Add Task</button>
  </div>

  <div class="columns">
    <section>
      <h2>Pending <span class="count" id="pendingCount">(0)</span></h2>
      <ul class="list" id="pendingList"></ul>
      <p class="empty-state" id="pendingEmpty" style="display:none;">No pending tasks.</p>
    </section>

    <section>
      <h2>Completed <span class="count" id="completedCount">(0)</span></h2>
      <ul class="list" id="completedList"></ul>
      <p class="empty-state" id="completedEmpty" style="display:none;">No completed tasks yet.</p>
    </section>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
