<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="dashboard-header">
  <h2>Dashboard</h2>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</div>

<div class="dashboard-body">
  <p>Welcome back, <strong id="welcomeName"></strong>! This page is only visible after logging in.</p>
  <button class="logout-btn" id="deleteAccountBtn" style="margin-top:20px;">Delete My Account</button>
</div>

<script src="auth.js"></script>
<script>
  // Protected page: redirect to login if no active session
  const currentUser = getSession();
  if (!currentUser) {
    window.location.href = 'index.html';
  } else {
    document.getElementById('welcomeName').textContent = currentUser;
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    endSession();
    window.location.href = 'index.html';
  });

  document.getElementById('deleteAccountBtn').addEventListener('click', () => {
    const confirmed = confirm('Are you sure? This will permanently delete your account.');
    if (confirmed) {
      deleteUser(currentUser);
      endSession();
      window.location.href = 'index.html';
    }
  });
</script>

</body>
</html>
