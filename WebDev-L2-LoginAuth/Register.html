<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="center-wrap">
  <div class="card">
    <h1>Create Account</h1>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg">Account created! Redirecting to login...</div>

    <form id="registerForm">
      <div class="field">
        <label for="username">Username or Email</label>
        <input type="text" id="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn-primary">Register</button>
    </form>

    <p class="switch-link">Already have an account? <a href="index.html">Login here</a></p>
  </div>
</div>

<script src="auth.js"></script>
<script>
  const form = document.getElementById('registerForm');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      showError('Please fill in both fields.');
      return;
    }

    if (userExists(username)) {
      showError('This username is already taken. Try logging in instead.');
      return;
    }

    if (!isPasswordValid(password)) {
      showError('Password must be at least 8 characters and include at least 1 number.');
      return;
    }

    await registerUser(username, password);

    successMsg.style.display = 'block';
    form.reset();

    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1200);
  });

  function showError(text) {
    errorMsg.textContent = text;
    errorMsg.style.display = 'block';
  }
</script>

</body>
</html>
